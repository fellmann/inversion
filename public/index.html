<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wolken 3D</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="place">
  <div id="placebox">
    <input id="placeinput" type="text" role="combobox" aria-expanded="false" aria-controls="placelist" aria-label="Ort suchen"
           autocomplete="off" spellcheck="false" placeholder="Ort suchen …">
    <button id="locate" type="button" title="Aktueller Standort" aria-label="Aktueller Standort"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg></button>
  </div>
  <ul id="placelist" role="listbox" hidden></ul>
  <div id="placemsg" hidden></div>
</div>
<div id="compass" title="Norden">
  <svg viewBox="-24 -24 48 48" width="48" height="48" aria-label="Kompass, Norden">
    <circle r="22" class="ring"/>
    <g id="needle"><path d="M0 -11 L4.5 3 L0 0 L-4.5 3 Z" class="north"/><path d="M0 11 L4.5 -3 L0 0 L-4.5 -3 Z" class="south"/><text id="nlabel" x="0" y="-16.5" text-anchor="middle" dominant-baseline="central">N</text></g>
  </svg>
</div>
<div id="update" hidden></div>
<div id="loading"><div id="loadmsg">Lade Daten …</div></div>

<div id="panel">
  <div id="topline">
    <button id="play" title="Abspielen (Leertaste)">▶</button>
    <div id="time">–</div>
    <div id="runinfo"></div>
  </div>
  <div id="strip"><canvas id="cover"></canvas><input id="slider" type="range" min="0" max="0" value="0" step="1"></div>
  <div id="opts">
    <label>Überhöhung <input id="exag" type="range" min="1" max="5" step="0.25" value="2"></label>
    <label>Wolken-Deckkraft <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.6"></label>
    <label><input id="showclouds" type="checkbox" checked> Wolken</label>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
