<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wolken über Freiburg</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="update" hidden></div>
<div id="loading"><div id="loadmsg">Lade Daten …</div></div>

<div id="panel">
  <div id="topline">
    <button id="play" title="Abspielen (Leertaste)">▶</button>
    <div id="time">–</div>
    <div id="runinfo"></div>
  </div>
  <div id="strip"><canvas id="cover"></canvas><input id="slider" type="range" min="0" max="0" value="0" step="1"></div>
  <div id="opts">
    <label>Überhöhung <input id="exag" type="range" min="1" max="5" step="0.25" value="2"></label>
    <label>Wolken-Deckkraft <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.6"></label>
    <label><input id="showclouds" type="checkbox" checked> Wolken</label>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
